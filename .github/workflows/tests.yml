name: tests

on:
  push:
  pull_request:

# the tests only read the code: the job's GITHUB_TOKEN gets no write access
permissions:
  contents: read

# a newer push to the same branch or PR replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the Dockerfile
          cache: pip
      - name: System packages (as in the Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q --durations=10  # parallel (pytest.ini); lists the slowest tests

  adventure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adventure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: adventure/package-lock.json
      - name: ffmpeg (the renderer mixes and cuts audio with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
