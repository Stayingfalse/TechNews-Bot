<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Quiz bot</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --ring: rgba(11,11,11,0.10);
  --ig: #2a78d6; --yt: #eb6834; --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ring: rgba(255,255,255,0.10); --ig: #3987e5; --yt: #d95926; }
}
:root[data-theme="dark"] { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ring: rgba(255,255,255,0.10); --ig: #3987e5; --yt: #d95926; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
       font: 15px/1.5 var(--font); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 28px; width: 100%; max-width: 360px;
        display: grid; gap: 12px; }
h1 { font-size: 22px; margin: 0; }
.note { color: var(--ink-2); margin: 0 0 4px; }
.btn { display: block; text-align: center; padding: 11px 14px; border-radius: 8px; color: #fff; font-weight: 600; text-decoration: none; }
.btn.instagram { background: var(--ig); }
.btn.youtube { background: var(--yt); }
.btn.plain { background: none; color: var(--ink); border: 1px solid var(--ring); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main class="card">{{body}}</main>
</body>
</html>
