[pytest]
testpaths = tests
pythonpath = .
# -n auto: tests run in parallel (pytest-xdist); each one already has its own data folder.
# Pass -n 0 to run in one process (e.g. with pdb).
addopts = -n auto --strict-markers
markers =
    slow: takes over 15 s (the real video encode, the odds simulation); skip locally with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning:starlette.*
